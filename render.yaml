# Blueprint для деплоя на Render.com из GitHub.
# В Dashboard: New → Blueprint → подключи репозиторий → Render создаст БД и Web Service.
databases:
  - name: teamfinder-db
    plan: free
    databaseName: teamfinder
    user: teamfinder

services:
  - type: web
    name: teamfinder-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: teamfinder-db
          property: connectionString
      - key: WEBAPP_URL
        sync: false
      - key: WEBAPP_HOST
        value: 0.0.0.0
      - key: PRICE_BEST_TEAM
        value: "5"
      - key: PRICE_HIGHLIGHT
        value: "7"
      - key: PRICE_CONTACT_PACK
        value: "3"
      - key: PRICE_PRO_SUBSCRIPTION
        value: "15"
      - key: PRICE_SINGLE_CONTACT
        value: "2"
      - key: PRICE_PREMIUM_APPLICATION
        value: "3"
      - key: SUPER_PRICE_STARS
        value: "999"
      - key: SUPER_DURATION_DAYS
        value: "30"
      - key: SUPER_WEEKLY_COINS
        value: "30000"
      - key: SUPER_WEEKLY_STARS
        value: "15000"
      - key: SUPER_WEEKLY_KEYS
        value: "10"
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: STEAM_WEB_API_KEY
        sync: false
      - key: STEAM_REDIRECT_URI
        sync: false
